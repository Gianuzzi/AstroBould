<> MEGNO (available only on particles) -

   calculate megno for particles                : no
    displacement for variational particles      : 1.d-6

-------------------------------------------------------------------------------
<> Internal reference frame (Available with only particles. Applied to surface section)

   use rotating reference frame                 : no 

-------------------------------------------------------------------------------
<> Surface section (available only with a single particle/moon) -

   calculate surface section parameters         : no
    coordinate to define the surface section    : 1  ! 1 => x , 2 => y, 3 => vx, 4 => vy, 5 => r, 6 => vr
    direction of surface crossing               : 1  ! -1 => Positive to Negative, 0 => Any, 1 => Negative to Positive
    value of surface                            : 0.0d0  ! In code units

    secondary coordinate to define the surface  : -1  ! 1 => x , 2 => y, 3 => vx, 4 => vy, 5 => r, 6 => vr, Other=> NOT USED
    minimum value for secondary coordinate      : 0.0d0  ! Crossing iff secondary > value

    absolute tolerance for surface crossing     : 0.d0  ! Surface accepted if |val - surf| < error
    timestep criteria to define surface         : 0.d0  ! Surface accepted if dt < criteria
    use interpolated step when crossing surface : no  ! Whether to use adaptive (y) or half (n) [recommended] step when crossing surface
    
    store interpolated values                   : no  ! Whether to store the interpolated or real values
    surface output file name                    : surface.out

-------------------------------------------------------------------------------
<> Filter -

   use filtering (yes / no)                     : no

    cutoff period (day)                         : 1.d0  ! -x => Asteroid Period * x
    samples per cutoff period                   : 7     ! Amount of integration steps of dt ~ df_fitered, per window
    kernel support in cutoff periods            : 5     ! Amount of windows to compute the filtering. Tfilter = cutoff * nwindows
    fraction of outputs to filter (0-1)         : 0.1d0  ! 0 => no filtering, 1 => filter all outputs, 0.5 => filter half of the outputs, etc.

    apply filter to K and H (yes / no)          : no    ! Whether to compute the filter on e, or K & H and then retrieve e
    kernel weights model                        : 1     ! 0: Boxcar, 1: Hann, 2:Hamming, 3:Blackman, 4:Flat Top
    prefix for filter files                     : filt  ! empty => filt ! Added to all files created according to below

-------------------------------------------------------------------------------
<> Binned forces/effects - [NOT AVAILABLE YET. STILL UNDER DEVELOPMENT]

   include self-gravity (yes / no)              : no
    max Legendre expansion order                : 5  ! Remember Legendre starts with 0, and even orders are null.

   total bins used                              : 5
   binning method                               : 3  ! 1 => equal dr, 2 => equal dA, 3 => equal particle amount each bin
   inner bin edge                               : -1.d0 ! <= 0 => equal to min(part_dist). ==0 is FIXED, <0 VARIES runtime
   outer bin edge                               : -1.d0 ! <= 0 => equal to max(part_dist). ==0 is FIXED, <0 VARIES runtime

-------------------------------------------------------------------------------
<> Conditions for Collision/Escape -

   particles radius (km)                           : 0.2d0  ! Just for collision purposes

   min distance from primary (km)                  : -1.01d0 ! rmin !  If 0 => Rast  ! -x => Rast * x
   max distance from primary (km)                  : -1.d1  ! rmax  !  If 0 => Infinity  (Not recommended) ! -x => Rast * x

   particle-massive merges activated (yes / no)    : yes  ! If no, simulation stops if any collision btw part-massive occurs
   massive merges activated (yes / no)             : yes  ! If no, simulation stops if any merge btw massive bodies occurs

   use moon soft-sphere collisions (yes / no)      : no  ! Used at every timestep
    moon-moon epsilon coll parameter               : 0.0d0  ! 0 < epsilon < 1 ! Used to calculate kappa and gamma
    moon-moon Tdur coll parameter (day)            : 0.0d0  ! > 0 ! Duration of the collision. Same as dt_min. ! Used to calculate kappa and gamma
    use moon explicit coll parameters              : no 
     moon-moon kappa coll parameter (day⁻²)        : 0.0d0  ! 0 <= kappa <= 1 ! 0: No bounce (disable), 1: Full bounce. kappa = omega_col²
     moon-moon gamma normal coll parameter (day⁻¹) : 0.0d0  ! 0 <= gamma <= 1 ! 0: No damping, 1: Full damping
    moon-moon beta ratio (gamma_t / gamma_n)       : 0.0d0  ! Only used if gamma_n > 0. Ratio tangential to normal damping
   
   moon-moon eta collision parameter               : 1.0d0  ! 0 <= eta <= 1 ! 0: Elastic, 1: Plastic   ! HARD-SPHERE (always active)
   moon-moon f collision parameter                 : 0.5d0  ! 0 <= f <= 1 ! Bounded: Etot < -f |Epot|  ! HARD-SPHERE (always active)

   use part soft-sphere collisions (yes / no)      : yes  ! Used at every timestep
    part-part epsilon coll parameter               : 0.1d0  ! 0 < epsilon < 1 ! Used to calculate kappa and gamma
    part-part Tdur coll parameter (day)            : 0.0011574d0  ! > 0 ! Duration of the collision. Same as dt_min. ! Used to calculate kappa and gamma
    use part explicit coll parameters              : no 
     part-part kappa coll parameter (day⁻²)        : 0.0d0  ! 0 <= kappa <= 1 ! 0: No bounce (disable), 1: Full bounce
     part-part gamma normal coll parameter (day⁻¹) : 0.0d0  ! 0 <= gamma <= 1 ! 0: No damping, 1: Full damping
    part-part beta ratio (gamma_t / gamma_n)       : 0.0d0  ! Only used if gamma_n > 0. Ratio tangential to normal damping
   
   coulomb cap for tangential collisions           : 0.5d0 ! 0 <= cap <= 1! Ft <= cap * Fn. ! Only active if SOFT-SPHERE collisions and gamma_t > 0
   deactivate collision if separating (yes / no)   : no   ! If yes, collisions are deactivated if the relative velocity at contact is separating
   min effective separation factor for collisions  : 0.1d0 ! dr = dr_factor * (R1 + R2) ! Minimum effective separation for a collision to occur. Used to avoid numerical issues when bodies are very close but not colliding
    
   use part hard-sphere collisions (yes / no)      : no  ! If yes, they are used at every output
    part-part eta coll parameter                   : 0.0d0  ! 0 <= eta < 1 ! 0: Elastic, 1: Plastic (disable, because of massless)
    part-part f coll parameter                     : 0.5d0  ! 0 <= f <= 1 ! Bounded: Etot < -f |Epot|

   stop if no particles left (yes / no)            : no 
   stop if no moons left (yes / no)                : no

   min bodies for grid construction                : 100    ! > 100 ! Use grid-based collision detection if number of bodies is above this threshold
   max cells for grid construction                 : 50000  ! Max amount of cells before falling back to brute-force
   min cell size for grid construction (km)        : 5.0d0 ! Minimum cell size to avoid too much overhead

   use Verlet list for collisions (yes / no)       : yes  ! Used at every timestep. Recommended if Nbodies >>>
    Verlet skin factor                             : 0.5d0  ! skin ~ factor * 2R
    use Verlet with moons (yes / no)               : no  ! Whether to use Verlet list for collisions involving moons instead of particles
   
   use substeps for collisions (yes / no)          : no  ! If yes, LF_DKD is used with substeps for collisions. If no, collisions are only checked at the output times. Recommended if close encounters are expected, but not recommended if many bodies and few outputs.
    sub-timestep for collision detection (day)     : 0.0011574d-1 ! If > 0, subdt = min(subdt, dt). If -1 < subdt < 0, subdt = |subdt| * dt. If subdt < -1, subdt = dt / |subdt|
   
