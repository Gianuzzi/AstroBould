           data input file for astrobould F90
           
-------------------------------------------------------------------------------
<> Times for the integration - 

   total integration time       (day)          : -3.d1  ! tf ! -tf => Period * tf
   negative time period body selector          : 0      ! -1 => min Per, 0=> central body Per, 1 => max Per
   output time interval         (day)          : 0.0d0  ! dt ! <= 0 to use number of outputs
   number of outputs                           : 100    ! Including initial and final time
   number of extra checkpoints to use          : 0      ! Used for extra chaos estimators
   output distribution (0 / 1 / 2)             : 2      ! 0 => linear, 1 => log, 2 => combination

-------------------------------------------------------------------------------
<> Extra parameters for the integration - 

   use parallel threads (yes / no / number)    : 8  ! yes or -1 for all cores

-------------------------------------------------------------------------------
<> Integrator configuration - (See /src/integrators/README.md)

   integrator ID to use                        : -23     ! 0 == BStoer

   use adaptive timestep (yes / no)            : no
    precision (digits per step)                : 15     ! -log10(etol)
    learning rate                              : 0.85d0 ! beta
   minimum timestep (or fixed timestep) (day)  : -1.d-4    ! x < 0 => min(Prot, Ppart, Pmoon) * |x|

-------------------------------------------------------------------------------
<> Primary mass (body 0) - 

   mass of primary (kg)                        : -7.0d18  ! m0 ! -x => mAst = x

-------------------------------------------------------------------------------
<> Primary shape (body 0) - 

   radius of primary (km)                      : 115.d0   ! R0 ! Unused if triaxial activated

   use triaxial model (yes / no)               : no  ! if no, uses boulders
    semi-axis a (km)                           : 143.8d0 ! triax-a
    semi-axis b (km)                           : 125.2d0 ! triax-b < triax_a  ! 0 -> triax-a
    semi-axis c (km)                           : 99.1d0 ! triax-c < triax_b  ! 0 -> triax-b

-------------------------------------------------------------------------------
<> Primary rotation (body 0) - 

   ratio of spin to keplerian rotation         : 0.d0 ! 0.471d0  ! lambda = spin/wk ! 0. if not used
   rotational period of asteroid (day)         : 0.2916667d0 ! Prot

