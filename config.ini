<> Extra forces/effects - 

   deactivate gravity between moons (yes / no)  : no  ! Still experimental. Does not disable collisions btw moons

   include manual J2 (yes / no)                 : no
    manual J2 value                             : 0.0d0
    set J2 from primary  (yes / no)             : no  ! if yes, J2 is evaluated from primary instead of from Asteroid CM
    primary radius to mean radius ratio         : 1.0d0 ! ignored if set from primary

   include two boulders on Z axis (yes / no)    : no  ! 2 equal masses, in Z+ and Z- will be added
    mass ratio of whole mass Z to primary       : 0.0d0  ! mu_z = mass_z / m0

   include stokes-like force (yes / no)         : no
    a damping charac time (day)                 : 0.0d0 ! tau_a
    e damping charac time (day)                 : 0.0d0 ! tau_e
    stokes force damping active timescale (day) : 0.0d0 ! tau_stokes ! <= 0 => Always active
    apply stokes-like to moons (yes / no)       : no

   include naive-stokes drag force (yes / no)   : no
    drag force coefficient [eta]                : 0.0d0 ! 0 == not used
    drag force active timescale (day)           : 0.0d0 ! tau_naive ! <= 0 => Always active
    apply drag to moons (yes / no)              : no

   include asteroid rotation damping (yes / no) : no
    rotation linear damp charac time (day)      : 0.0d0 ! tau_o ! 0 == not used !! Cant use multiple damps
    rotation exponential damp charac time (day) : 0.0d0 ! tau_o ! 0 == not used !! Cant use multiple damps
    rotation A poly_exp damp coefficient        : 0.0d0 !  ! 0 == not used !! Cant use multiple damps
    rotation B poly_exp damp coefficient        : 0.0d0 !  ! 0 == not used !! Cant use multiple damps
    omega damping active timescale (day)        : 0.0d0 ! tau_omega !  <= 0 => Always active

   mass exponential damp charac time (day)      : 0.0d0 ! tau_m ! 0 == not used !! [NOT AVAILABLE YET]

